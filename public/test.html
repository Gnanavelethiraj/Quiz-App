<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test - Daakle Quiz App</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body{ background:#111; color:#fff; }
    .hero{ background:linear-gradient(rgba(0,0,0,.7),rgba(0,0,0,.7)),url("https://images.unsplash.com/photo-1537432376769-00a708388b21") center/cover; padding:80px; }
    .btn-primary{ background:#4cafef; border:none; }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm sticky-top">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold text-uppercase" href="index.html">DAAKLE</a>
      <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="aptitude.html">Aptitude</a></li>
          <li class="nav-item"><a class="nav-link" href="learn.html">Learn</a></li>
          <li class="nav-item"><a class="nav-link active" href="test.html">Test</a></li>
          <li class="nav-item"><a class="nav-link" href="achievements.html">Achievements</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Hero -->
  <section class="hero text-center text-white">
    <h1>Take a Test</h1>
  </section>

  <!-- Quiz -->
  <section class="container py-5">
    <h2 id="topicName"></h2>
    <div id="quiz"></div>
    <button class="btn btn-primary mt-3" onclick="submitQuiz()">Submit</button>
    <p id="result" class="mt-3"></p>
  </section>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const topic = urlParams.get("topic") || "numbers";
    document.getElementById("topicName").textContent = topic.toUpperCase() + " Test";

    const questions = {
      numbers: [
        {q:"2+2=?",a:"4",options:["3","4","5"]},
        {q:"Prime after 7?",a:"11",options:["9","11","13"]}
      ],
      lcmhcf: [
        {q:"LCM of 4 and 6?",a:"12",options:["10","12","24"]}
      ],
      algebra: [
        {q:"x+2=5, x=?",a:"3",options:["2","3","5"]}
      ]
    };

    const quizDiv=document.getElementById("quiz");
    questions[topic].forEach((item,i)=>{
      let html=`<div class="mb-3"><p>${i+1}. ${item.q}</p>`;
      item.options.forEach(opt=>{
        html+=`<label><input type="radio" name="q${i}" value="${opt}"> ${opt}</label><br>`;
      });
      html+="</div>";
      quizDiv.innerHTML+=html;
    });

    function submitQuiz(){
      let score=0;
      questions[topic].forEach((item,i)=>{
        const ans=document.querySelector(`input[name="q${i}"]:checked`);
        if(ans && ans.value===item.a) score++;
      });
      const result=document.getElementById("result");
      if(score===questions[topic].length){
        result.textContent="🎉 Passed! Badge Earned!";
        let badges=JSON.parse(localStorage.getItem("badges")||"[]");
        if(!badges.includes(topic)) badges.push(topic);
        localStorage.setItem("badges",JSON.stringify(badges));
      }else{
        result.textContent=`You scored ${score}/${questions[topic].length}. Try again!`;
      }
    }
  </script>
</body>
</html>
