<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Achievements - Daakle Quiz App</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body{ background:#111; color:#fff; }
    .hero{ background:linear-gradient(rgba(0,0,0,.7),rgba(0,0,0,.7)),url("https://images.unsplash.com/photo-1523050854058-8df90110c9f1") center/cover; padding:80px; }
    .badge-card{ background:rgba(255,255,255,.1); border-radius:10px; padding:20px; }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm sticky-top">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold text-uppercase" href="index.html">DAAKLE</a>
      <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="aptitude.html">Aptitude</a></li>
          <li class="nav-item"><a class="nav-link" href="learn.html">Learn</a></li>
          <li class="nav-item"><a class="nav-link" href="test.html">Test</a></li>
          <li class="nav-item"><a class="nav-link active" href="achievements.html">Achievements</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Hero -->
  <section class="hero text-center text-white">
    <h1>Your Achievements</h1>
  </section>

  <!-- Badges -->
  <section class="container py-5">
    <div id="badgesRow" class="row g-4"></div>
  </section>

  <script>
    const badges=JSON.parse(localStorage.getItem("badges")||"[]");
    const row=document.getElementById("badgesRow");
    if(badges.length===0){
      row.innerHTML="<p class='text-center'>No badges earned yet.</p>";
    }else{
      badges.forEach(b=>{
        row.innerHTML+=`<div class="col-md-4"><div class="badge-card text-center"><h5>${b.toUpperCase()} Badge 🏆</h5></div></div>`;
      });
    }
  </script>
</body>
</html>
